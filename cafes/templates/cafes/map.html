{% extends 'cafes/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
    /* ================= PAGE LAYOUT ================= */
    .map-page { position: relative; z-index: 0; height: 100vh; overflow: hidden; background: var(--bg); }
    #map { position: absolute; inset: 0; z-index: 0; background: var(--bg); }

    /* fades the top of the map into the page so the navbar is always readable */
    .map-scrim {
        position: absolute;
        inset: 0 0 auto 0;
        height: 270px;
        z-index: 500;
        pointer-events: none;
        background: linear-gradient(var(--bg) 0%, var(--bg) 52%, transparent 100%);
    }

    /* tints the map tiles to match the burgundy theme */
[data-theme="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) sepia(.55) saturate(1.5) hue-rotate(-20deg) brightness(.82) contrast(.95); }
[data-theme="light"] .leaflet-tile-pane { filter: sepia(.3) saturate(1.15); }

    /* ================= SEARCH PANEL ================= */
    .map-panel {
        position: absolute;
        z-index: 600;
        left: 2rem;
        top: 250px;
        bottom: 2rem;
        width: 340px;
        display: flex;
        flex-direction: column;
        padding: 1.4rem;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, .3);
    }
    .map-panel h2 { font-size: 1.8rem; margin: 0 0 .9rem; }
    #pq { padding: .8rem 1.2rem; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 40px; }
    #pq::placeholder { color: var(--muted); }
    .pcount { font-size: .8rem; color: var(--muted); margin: .7rem 0; }
    .plist { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0; }
    .pitem { display: block; width: 100%; padding: .8rem .9rem; text-align: left; font: inherit; color: var(--text); background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 14px; transition: background .25s; }
    .pitem:hover { background: var(--surface); }
    .pitem strong { display: block; font: 400 1.1rem 'Playfair Display', serif; }
    .pitem span { font-size: .8rem; color: var(--muted); }

    /* ================= THE CAT ================= */
    .map-cat { position: absolute; z-index: 600; right: 2rem; bottom: 8.5rem; width: 130px; padding: 0; background: none; border: 0; }
    .map-cat img { display: block; width: 100%; filter: var(--logo-filter) drop-shadow(0 6px 12px rgba(0, 0, 0, .4)); animation: bounceCat 3.5s infinite alternate ease-in-out; }
    .say {
        position: absolute;
        right: 100%;
        top: 0;
        width: 130px;
        margin-right: .5rem;
        padding: .6rem .8rem;
        font-size: .78rem;
        line-height: 1.4;
        text-align: left;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--tan);
        border-radius: 16px 16px 4px 16px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, .25);
    }

    /* ================= RED CAT-EAR PINS ================= */
    .kc-pin { background: none; border: 0; }
    .kc-pin svg {
        display: block;
        width: 32px;
        height: 42px;
        filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .35));
        transform-origin: 50% 100%;
        transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
        animation: pinDrop .7s cubic-bezier(.34, 1.56, .64, 1) backwards;
        animation-delay: calc(var(--i, 0) * 70ms);
    }
    .kc-pin:hover svg, .kc-pin.hl svg { transform: translateY(-5px) scale(1.15); }
    @keyframes pinDrop { from { opacity: 0; transform: translateY(-40px) scale(.6); } }

    /* ================= HOVER CARD ================= */
    .leaflet-tooltip.kc-tip {
        width: 220px;
        padding: 0;
        overflow: hidden;
        white-space: normal;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--tan);
        border-radius: 20px;
        box-shadow: 0 14px 30px rgba(0, 0, 0, .4);
    }
    .leaflet-tooltip-top.kc-tip::before { border-top-color: var(--tan); }
    .tip-img { display: grid; place-items: center; width: 100%; height: 110px; object-fit: cover; background: radial-gradient(circle at 50% 30%, var(--hero-glow), var(--bg)); font: italic 400 3rem 'Playfair Display', serif; color: var(--tan); }
    .tip-b { padding: .7rem 1rem .9rem; }
    .tip-b strong { display: block; font: 400 1.1rem 'Playfair Display', serif; }
    .tip-b span { font-size: .78rem; color: var(--muted); }

    /* ================= CLICK POPUP ================= */
    .leaflet-popup-content-wrapper { background: var(--bg); color: var(--text); border: 1px solid var(--tan); border-radius: 22px; box-shadow: 0 18px 40px rgba(0, 0, 0, .4); }
    .leaflet-popup-content { margin: 1.3rem 1.4rem; font-family: 'Inter', sans-serif; }
    .leaflet-popup-tip { background: var(--bg); border: 1px solid var(--tan); }
    .leaflet-container a.leaflet-popup-close-button { top: 8px; right: 10px; color: var(--text); }
    .pop h3 { font-size: 1.5rem; margin: 0 0 .2rem; }
    .pop-sub { margin: 0 0 .8rem; font-size: .82rem; color: var(--muted); }
    .pop-tags { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .9rem; }
    .pop-tags span { font-size: .72rem; border: 1px solid var(--line); border-radius: 20px; padding: .15rem .65rem; }
    .pop p { margin: .3rem 0; font-size: .85rem; line-height: 1.55; color: var(--muted); }
    .pop ul { list-style: none; margin: .4rem 0 .9rem; padding: 0; font-size: .8rem; line-height: 1.6; color: var(--muted); }
    .pop a { color: var(--tan); }

    /* ================= ZOOM BUTTONS AND ATTRIBUTION ================= */
    .leaflet-bar { border: 0; box-shadow: none; }
    .leaflet-bar a { width: 38px; height: 38px; line-height: 38px; color: var(--text); background: var(--bg); border: 1px solid var(--line); }
    .leaflet-bar a:hover { color: var(--text); background: var(--surface); }
    .leaflet-bar a:first-child { border-radius: 19px 19px 0 0; }
    .leaflet-bar a:last-child { border-radius: 0 0 19px 19px; }
    .leaflet-control-attribution { color: var(--muted) !important; background: color-mix(in srgb, var(--bg) 80%, transparent) !important; }
    .leaflet-control-attribution a { color: var(--tan) !important; }

    @media (max-width: 820px) {
        .map-panel { top: auto; left: 1rem; right: 1rem; bottom: 1rem; width: auto; max-height: 40vh; }
        .map-cat { display: none; }
    }
</style>

<div class="map-page">
    <div id="map"></div>
    <div class="map-scrim"></div>

    <aside class="map-panel">
        <h2>Find a cafe</h2>
        <input id="pq" type="search" placeholder="Search name or barangay" aria-label="Search cafes" autocomplete="off">
        <p id="pcount" class="pcount"></p>
        <ul id="plist" class="plist"></ul>
    </aside>

    <button type="button" class="map-cat" id="map-cat" aria-label="Take me to a random cafe">
        <span class="say">Where to, kopi cat?<br>Tap me!</span>
        <img src="{% static 'cafes/cat.png' %}" alt="">
    </button>
</div>

<!-- Must stay outside the script tags -->
{{ cafes|json_script:"cafes-data" }}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
    var $ = function (id) { return document.getElementById(id); };
    var HOME = "{% url 'home' %}";
    var PRICE = { '$': '₱', '$$': '₱₱', '$$$': '₱₱₱' };

    /* Red pin with little cat ears */
    var PIN = '<svg viewBox="0 0 32 42" aria-hidden="true">' +
        '<path fill="#C8352B" d="M4 14 5 1l9 4zM28 14 27 1l-9 4z"/>' +
        '<path fill="#C8352B" d="M16 41C16 41 3 26 3 16a13 13 0 0 1 26 0c0 10-13 25-13 25z"/>' +
        '<circle cx="16" cy="16" r="5" fill="#F6F3E4"/></svg>';

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
    }

    var cafes = JSON.parse($('cafes-data').textContent).filter(function (c) {
        return c.latitude && c.longitude;
    });

    /* ---- Map and light/dark tiles ---- */
    var map = L.map('map', { zoomControl: false }).setView([14.8433, 120.8114], 14);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri',
        maxZoom: 19
    }).addTo(map);
    
    /* ---- Hover card and popup content ---- */
    function tipHtml(c) {
        var pic = c.image
            ? '<img class="tip-img" src="' + esc(c.image) + '" alt="">'
            : '<div class="tip-img">' + esc(c.name.charAt(0)) + '</div>';
        var meta = [c.rating ? '★ ' + c.rating : '', c.barangay, PRICE[c.price_range] || ''].filter(Boolean).join('  |  ');
        return pic + '<div class="tip-b"><strong>' + esc(c.name) + '</strong><span>' + esc(meta) + '</span></div>';
    }

    function popupHtml(c) {
        var tags = (c.vibe_tags || '').split(',').map(function (t) { return t.trim(); }).filter(Boolean)
            .map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('');
        var hours = (c.hours || '').split(';').map(function (h) { return h.trim(); }).filter(Boolean)
            .map(function (h) { return '<li>' + esc(h) + '</li>'; }).join('');
        var sub = [c.barangay + ', Bulacan', PRICE[c.price_range] || '', c.rating ? '★ ' + c.rating : ''].filter(Boolean).join('  |  ');
        return '<div class="pop"><h3>' + esc(c.name) + '</h3>' +
            '<p class="pop-sub">' + esc(sub) + '</p>' +
            '<div class="pop-tags">' + tags + '</div>' +
            (c.signature_drink ? '<p>Signature drink: ' + esc(c.signature_drink) + '</p>' : '') +
            '<p>' + esc(c.address) + '</p>' +
            (hours ? '<ul>' + hours + '</ul>' : '') +
            '<a href="' + HOME + '#malolos-collection">See it in the collection</a></div>';
    }

    /* ---- Pins ---- */
    var group = L.featureGroup().addTo(map), markers = {};

    cafes.forEach(function (c, i) {
        var m = L.marker([c.latitude, c.longitude], {
            title: c.name,
            icon: L.divIcon({
                className: 'kc-pin',
                html: PIN,
                iconSize: [32, 42],
                iconAnchor: [16, 41],
                tooltipAnchor: [0, -40],
                popupAnchor: [0, -38]
            })
        });
        m.bindTooltip(tipHtml(c), { direction: 'top', opacity: 1, className: 'kc-tip' });
        m.bindPopup(popupHtml(c), {
            className: 'kc-pop',
            maxWidth: 300,
            autoPanPaddingTopLeft: [380, 270],
            autoPanPaddingBottomRight: [40, 40]
        });
        m.on('popupopen', function () { m.closeTooltip(); });
        m.addTo(group);
        m.getElement().style.setProperty('--i', i);
        markers[c.slug] = m;
    });

    function focusCafe(c) {
        var m = markers[c.slug];
        map.flyTo([c.latitude, c.longitude], Math.max(map.getZoom(), 16), { duration: 1.1 });
        setTimeout(function () { if (!m.isPopupOpen()) m.openPopup(); }, 1250);
    }

    /* ---- Side panel list and search ---- */
    var items = cafes.map(function (c) {
        var li = document.createElement('li'), b = document.createElement('button');
        var meta = [c.barangay, PRICE[c.price_range] || '', c.rating ? '★ ' + c.rating : ''].filter(Boolean).join('  |  ');
        b.type = 'button';
        b.className = 'pitem';
        b.innerHTML = '<strong>' + esc(c.name) + '</strong><span>' + esc(meta) + '</span>';
        b.addEventListener('click', function () { focusCafe(c); });
        b.addEventListener('mouseenter', function () { var el = markers[c.slug].getElement(); if (el) el.classList.add('hl'); });
        b.addEventListener('mouseleave', function () { var el = markers[c.slug].getElement(); if (el) el.classList.remove('hl'); });
        li.appendChild(b);
        $('plist').appendChild(li);
        return { c: c, li: li };
    });

    function filter() {
        var s = $('pq').value.trim().toLowerCase(), n = 0;
        items.forEach(function (it) {
            var c = it.c;
            var ok = !s || (c.name + ' ' + c.barangay + ' ' + c.address).toLowerCase().indexOf(s) > -1;
            it.li.hidden = !ok;
            if (ok) { group.addLayer(markers[c.slug]); n++; } else { group.removeLayer(markers[c.slug]); }
        });
        $('pcount').textContent = n + (n === 1 ? ' cafe' : ' cafes');
    }
    $('pq').addEventListener('input', filter);
    filter();

    /* ---- The cat picks a random cafe ---- */
    $('map-cat').addEventListener('click', function () {
        var visible = items.filter(function (it) { return !it.li.hidden; });
        if (visible.length) focusCafe(visible[Math.floor(Math.random() * visible.length)].c);
    });

    /* ---- Opening from the Discover page: /map/?cafe=slug ---- */
    var want = new URLSearchParams(location.search).get('cafe');
    var hit = cafes.filter(function (c) { return c.slug === want; })[0];
    if (hit) {
        focusCafe(hit);
    } else if (cafes.length) {
        map.fitBounds(group.getBounds(), { paddingTopLeft: [400, 280], paddingBottomRight: [60, 60], maxZoom: 15 });
    }
})();
</script>
{% endblock %}
